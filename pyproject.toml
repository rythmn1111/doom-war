[project]
name = "doom-war"
version = "0.1.0"
description = "LAYA vs JEV - two System One models fight a Doom deathmatch"
requires-python = ">=3.11,<3.13"
dependencies = [
  "vizdoom>=1.3.1",
  "numpy>=1.26",
  "httpx>=0.28",
  "pillow>=10",
]

[project.optional-dependencies]
laya = ["laya-mlx>=0.1.0; sys_platform == 'darwin' and platform_machine == 'arm64'"]
render = ["matplotlib>=3.10"]

[project.scripts]
doom-war = "doomwar.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["doomwar"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.urls]
Repository = "https://github.com/rythmn1111/doom-war"
Issues = "https://github.com/rythmn1111/doom-war/issues"
